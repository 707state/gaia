[[sensitive_prefixes]]
value = "/etc/shadow"
enabled = true

[[sensitive_prefixes]]
value = "/etc/ssl"
enabled = true

[[sensitive_prefixes]]
value = "/root/.ssh"
enabled = true

[[sensitive_prefixes]]
value = "/var/lib/gaia"
enabled = true

[[monitored_services]]
value = "sshd.service"
enabled = true

[[monitored_services]]
value = "nginx.service"
enabled = true

[[exec_whitelist_prefixes]]
value = "/usr/bin"
enabled = true

[[exec_whitelist_prefixes]]
value = "/usr/sbin"
enabled = true

[[exec_whitelist_prefixes]]
value = "/bin"
enabled = true

[[exec_whitelist_prefixes]]
value = "/sbin"
enabled = true

[[blocked_ports]]
port = 4444
enabled = true

[[blocked_ports]]
port = 31337
enabled = true

[baseline_thresholds]
file_io = 200
process = 80
privilege = 20
network = 160
hotpatch = 50

